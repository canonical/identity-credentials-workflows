name: TICS

on:
  workflow_call:
    inputs:
      project:
        description: "The name of the TiCS project to submit the analysis to"
        required: true
        type: string
      dir:
        description: "The directory where the code and tox.ini is located, if not the root of the repository"
        required: false
        default: "."
        type: string
      fetch_libs:
        description: "Whether to fetch the charm libs defined in charmcraft.yaml"
        required: false
        type: boolean
        default: false
      exclude_paths:
        description: "Space-separated paths, relative to dir, to remove before the TiCS analysis (e.g. 'tests .vendored')"
        required: false
        type: string
        default: ""
    secrets:
      TICSAUTHTOKEN:
        required: true

jobs:
  analyze:
    runs-on: [self-hosted, linux, amd64, tiobe, jammy]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3.10-venv pipx

      - name: Install charmcraft
        run: |
          sudo snap install charmcraft --classic

      - name: Install tox using pipx
        run: |
          pipx install tox
          pipx inject tox tox-uv

      - name: Fetch charm libraries
        if: ${{ inputs.fetch_libs == true }}
        working-directory: ${{ inputs.dir }}
        run: |
          charmcraft fetch-libs

      - name: Run tox tests to create coverage.xml
        working-directory: ${{ inputs.dir }}
        run: |
          tox run -e unit

      - name: move results to necessary folder for TICS
        run: |
          mkdir ${{ inputs.dir }}/cover
          mv ${{ inputs.dir }}/coverage.xml ${{ inputs.dir }}/cover/coverage.xml

      - name: Remove excluded paths from TiCS analysis
        if: ${{ inputs.exclude_paths != '' }}
        working-directory: ${{ inputs.dir }}
        env:
          EXCLUDE_PATHS: ${{ inputs.exclude_paths }}
        run: |
          set -euo pipefail
          set -f
          for p in $EXCLUDE_PATHS; do
            case "/$p/" in
              //*|*/../*|*/./*|/cover/*)
                echo "::error::Refusing to exclude unsafe path: $p"
                exit 1
                ;;
            esac
            echo "Excluding $p"
            rm -rf -- "$p"
          done

      - name: Run TICS analysis with github-action
        uses: tiobe/tics-github-action@016a4d79f3027fe7b4a2901619a58c745ab7cadf # v3
        with:
          mode: qserver
          project: ${{ inputs.project}}
          branchdir: ${{ github.workspace }}/${{ inputs.dir }}
          viewerUrl: https://canonical.tiobe.com/tiobeweb/TICS/api/cfg?name=default
          ticsAuthToken: ${{ secrets.TICSAUTHTOKEN }}
          installTics: true
