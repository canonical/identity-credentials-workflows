name: Charm Security Scan

on:
  workflow_call:
    inputs:
      charm:
        description: Charm name on CharmHub (for example vault-k8s)
        required: true
        type: string
      track:
        description: Track to scan (for example 2.0)
        required: true
        type: string
      channel:
        description: Channel to scan (for example edge)
        required: true
        type: string
      arch:
        description: Architecture to download and scan
        required: false
        default: amd64
        type: string
      base:
        description: Ubuntu base to download (ubuntu@22.04, ubuntu@24.04 or ubuntu@26.04). Empty uses Juju's default.
        required: false
        default: ""
        type: string
      create-issue:
        description: Create GitHub issue on CVE findings
        required: false
        default: true
        type: boolean
      fail-on-cve:
        description: Fail the job on CVE findings
        required: false
        default: false
        type: boolean
    outputs:
      secscan-return-code:
        description: Return code of secscan
        value: ${{ jobs.secscan.outputs.secscan-return-code }}

jobs:
  secscan:
    runs-on: [self-hosted, self-hosted-linux-amd64-jammy-private-endpoint-medium]
    outputs:
      secscan-return-code: ${{ steps.secscan.outputs.secscan-return-code }}
    steps:
      - name: Install Juju
        run: sudo snap install juju --channel=4.0/stable

      - name: Install secscan client
        run: |
          sudo snap install canonical-secscan-client
          sudo snap connect canonical-secscan-client:home system:home

      - name: Download charm from CharmHub
        env:
          CHARM: ${{ inputs.charm }}
          TRACK: ${{ inputs.track }}
          CHANNEL: ${{ inputs.channel }}
          ARCH: ${{ inputs.arch }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          base_args=()
          if [[ -n "$BASE" ]]; then
            case "$BASE" in
              ubuntu@22.04|ubuntu@24.04|ubuntu@26.04) ;;
              *) echo "Unsupported Ubuntu base: $BASE" >&2; exit 1 ;;
            esac
            base_args=(--base "$BASE")
          fi
          juju download "$CHARM" \
            --channel "$TRACK/$CHANNEL" \
            --arch "$ARCH" \
            "${base_args[@]}" \
            --filepath charm-under-test.charm 2>&1 | tee juju-download.log
          # juju download silently falls back to another base if the requested one isn't published
          if [[ -n "$BASE" ]] && ! grep -qF "base \"$ARCH/${BASE/@//}\"" juju-download.log; then
            echo "$CHARM is not published for $BASE ($ARCH) in $TRACK/$CHANNEL" >&2
            exit 1
          fi

      - name: Run secscan
        id: secscan
        run: |
          set +e
          set -o pipefail
          secscan-client --batch submit \
            --scanner trivy \
            --type package \
            --format charm \
            charm-under-test.charm \
            --wait-and-print | tee secscan.result
          RC=$?
          echo "secscan-return-code=$RC" >> "$GITHUB_OUTPUT"
          set +o pipefail
          set -e

      - name: Create issue on CVE findings
        if: ${{ inputs.create-issue && steps.secscan.outputs.secscan-return-code != '0' }}
        run: |
          echo "please check job ${{ github.run_id }}" >> secscan.result
          title="Security scan found vulnerabilities in $CHARM ($TRACK/$CHANNEL, $ARCH${BASE:+, $BASE})"
          gh issue create -R "${{ github.repository }}" \
            --label bug \
            --title "$title" \
            -F secscan.result
        env:
          GH_TOKEN: ${{ github.token }}
          CHARM: ${{ inputs.charm }}
          TRACK: ${{ inputs.track }}
          CHANNEL: ${{ inputs.channel }}
          ARCH: ${{ inputs.arch }}
          BASE: ${{ inputs.base }}

      - name: Fail job on CVE findings
        if: ${{ inputs.fail-on-cve && steps.secscan.outputs.secscan-return-code != '0' }}
        run: |
          echo "secscan found issues, failing the job."
          exit 1
